name: Canonical Qwen3.8-27B NPU bring-up
on:
  push:
    branches: [feat/qwen3.8-27b]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: qwen38-27b-canonical
  cancel-in-progress: true
env:
  TORCH2AIE_REPO: https://github.com/bong-water-water-bong/torch2aie.git
  TORCH2AIE_SHA: 1e17e9fe0a0bc428b8a371dc8e4adbe69ee31fcc
  CONVERTER_SHA: d1d5232d0b82871bf5265e990fa2d26cdad22327
  TOOLCHAIN_TAG: toolchain-2026-06-02
  TOOLCHAIN_SHA256: 70222aa334057fde23be96b8763fb63b53ff7615ec004ac16ecba3abb3d5aefb
  HIDDEN_SIZE: 5120
  FFN_SIZE: 17408
  VOCAB_SIZE: 248320
  LAYERS: 64
  HEADS: 24
  KV_HEADS: 4
  HEAD_DIM: 256
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euxo pipefail
          python3 tools/npu/qwen38_27b_geometry.py tools/npu/qwen38_27b_geometry.json
          python3 tools/npu/qwen38_27b_layer_plan.py
          python3 - <<'PY'
          import json
          p=json.load(open('tools/npu/qwen38_27b_layer_plan.json'))
          assert (p['hidden_size'],p['intermediate_size'],p['vocab_size'],p['num_hidden_layers'])==(5120,17408,248320,64)
          assert (p['num_attention_heads'],p['num_key_value_heads'],p['head_dim'])==(24,4,256)
          assert p['layer_types']==['linear_attention','linear_attention','linear_attention','full_attention']*16
          assert len(p['layer_types'])==64
          print(json.dumps(p,indent=2))
          PY
  q4nx:
    needs: geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Convert and validate genuine 27B Q4NX
        run: |
          set -euxo pipefail
          python3 -m pip install --user uv; export PATH="$HOME/.local/bin:$PATH"
          git clone --depth 1 https://github.com/ROCm/FLM_Q4NX_Converter.git /tmp/conv; cd /tmp/conv; git fetch --depth 1 origin "$CONVERTER_SHA"; git checkout --detach "$CONVERTER_SHA"
          python3 -m venv /tmp/q4nx
          uv pip install --python /tmp/q4nx/bin/python numpy einops safetensors pyyaml huggingface_hub
          uv pip install --python /tmp/q4nx/bin/python torch --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama; cp -r /tmp/llama/gguf-py/gguf /tmp/q4nx/lib/python3.12/site-packages/
          python3 "$GITHUB_WORKSPACE/tools/npu/qwen38_27b_q4nx_patch.py" /tmp/conv
          /tmp/q4nx/bin/hf download bartowski/Qwen3.8-27B-GGUF --include 'Qwen3.8-27B-Q4_1.gguf' --local-dir /tmp/src
          for f in config.json tokenizer.json tokenizer_config.json chat_template.jinja; do /tmp/q4nx/bin/hf download Qwen/Qwen3.8-27B --include "$f" --local-dir /tmp/meta; done
          SRC=$(find /tmp/src -type f -name '*.gguf' -print -quit); test -n "$SRC"; case "$(basename "$SRC")" in *8B*|*9B*|*0.6B*|*30B*) exit 2;; esac
          /tmp/q4nx/bin/python - "$SRC" <<'PY'
          import sys
          from gguf import GGUFReader
          r=GGUFReader(sys.argv[1]); f=r.fields
          def scalar(key):
              v=f[key]
              x=v.contents() if hasattr(v,'contents') else v
              if hasattr(x,'tolist'): x=x.tolist()
              if isinstance(x,list) and len(x)==1: x=x[0]
              if isinstance(x,(bytes,bytearray)): x=x.decode(errors='ignore')
              return x
          c={'architecture':scalar('general.architecture'),'blocks':scalar('qwen35.block_count'),'hidden':scalar('qwen35.embedding_length'),'ffn':scalar('qwen35.feed_forward_length'),'heads':scalar('qwen35.attention.head_count'),'kv_heads':scalar('qwen35.attention.head_count_kv'),'head_dim':scalar('qwen35.attention.key_length'),'mtp_layers':scalar('qwen35.mtp_num_hidden_layers')}
          print(c)
          assert str(c['architecture']).lower()=='qwen35'
          assert int(c['blocks'])==65, 'GGUF block_count must be 64 trunk layers + 1 MTP layer'
          assert int(c['mtp_layers'])==1
          assert (int(c['hidden']),int(c['ffn']),int(c['heads']),int(c['kv_heads']),int(c['head_dim']))==(5120,17408,24,4,256)
          PY
          /tmp/q4nx/bin/python - <<'PY'
          import json,hashlib,shutil
          from pathlib import Path
          from q4nx import create_converter
          from q4nx.constants import ModelArch,ModelArchNames,ModelArchConfigs
          assert ModelArch.QWEN35_27B in ModelArchNames and 'qwen3.8-27B' in ModelArchNames[ModelArch.QWEN35_27B] and ModelArchConfigs[ModelArch.QWEN35_27B]=='qwen3.5_27b.json'
          src=next(Path('/tmp/src').glob('*.gguf')); out=Path('/tmp/pkg'); out.mkdir(); create_converter(str(src),'qwen3.8-27B').convert(q4nx_path=str(out),weights_type='language'); q=out/'model.q4nx'; assert q.is_file() and q.stat().st_size>10_000_000_000
          c=json.loads(Path('/tmp/meta/config.json').read_text());
          expected={'hidden_size':5120,'intermediate_size':17408,'vocab_size':248320,'num_hidden_layers':64,'num_attention_heads':24,'num_key_value_heads':4}
          for k,v in expected.items(): assert int(c[k])==v, f'{k}={c[k]}'
          m={'model':'qwen3.8:27b','architecture':'qwen3.5','source_gguf':src.name,'source_sha256':hashlib.sha256(src.read_bytes()).hexdigest(),'hidden_size':5120,'intermediate_size':17408,'vocab_size':248320,'num_hidden_layers':64,'num_attention_heads':24,'num_key_value_heads':4,'head_dim':256,'linear_num_key_heads':16,'linear_num_value_heads':48,'linear_key_head_dim':128,'linear_value_head_dim':128,'mtp_num_hidden_layers':1,'layer_types':['linear_attention','linear_attention','linear_attention','full_attention']*16,'q4nx_file':'model.q4nx','q4nx_bytes':q.stat().st_size,'q4nx_sha256':hashlib.sha256(q.read_bytes()).hexdigest()}; (out/'manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          for n in ('config.json','tokenizer.json','tokenizer_config.json','chat_template.jinja'): shutil.copy2(Path('/tmp/meta')/n,out/n)
          print(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qwen38-27b-q4nx
          path: /tmp/pkg
          retention-days: 14
  layer:
    needs: geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Generate genuine 27B layer.xclbin with Peano
        run: |
          set -euxo pipefail
          git clone "$TORCH2AIE_REPO" "$HOME/torch2aie"; cd "$HOME/torch2aie"; git checkout --detach "$TORCH2AIE_SHA"; grep -qx 'tag=toolchain-2026-06-02' <(grep '^tag=' toolchain-release.lock); grep -qx 'archive_sha256=70222aa334057fde23be96b8763fb63b53ff7615ec004ac16ecba3abb3d5aefb' <(grep '^archive_sha256=' toolchain-release.lock); bash scripts/install_toolchain_from_release.sh; python3 -m pip install --user uv; export PATH="$HOME/.local/bin:$PATH"; bash scripts/setup_python.sh; source .venv/bin/activate; source scripts/env.sh
          PEANO=$(find "$HOME/torch2aie/toolchain" -type f -path '*/bin/clang++' -perm -111 -print -quit); test -n "$PEANO"; export PEANO_INSTALL_DIR="$(dirname "$(dirname "$PEANO")")"; export QWEN38_USE_PEANO=1; export QWEN38_27B_BUILD_ONLY=1; cd examples/qwen3-decode-layer; python3 "$GITHUB_WORKSPACE/tools/npu/qwen38_27b_torch2aie_adapter.py" "$HOME/torch2aie"; python3 "$GITHUB_WORKSPACE/tools/npu/qwen38_27b_build_patch_v3.py" "$HOME/torch2aie"; "$HOME/torch2aie/.venv/bin/python" -m py_compile cases/full_layer_engine_generate.py cases/qwen3_8b_decode_layer_runner.py npu_build.py; make CURRENT_TOKEN=31 LAYER=0 MODEL_PATH=/nonexistent full-build
          X=$(find build -type f -name '*.xclbin' -printf '%T@ %p\n'|sort -nr|head -1|cut -d' ' -f2-); MLIR=$(find build -type f -name 'design.mlir' -printf '%T@ %p\n'|sort -nr|head -1|cut -d' ' -f2-); test -s "$X"; test -s "$MLIR"; mkdir -p "$GITHUB_WORKSPACE/layer-artifact"; cp "$X" "$GITHUB_WORKSPACE/layer-artifact/layer.xclbin"; cp "$MLIR" "$GITHUB_WORKSPACE/layer-artifact/layer.mlir"; python3 - <<'PY'
          import json
          m={'model':'qwen3.8:27b','hidden_size':5120,'intermediate_size':17408,'vocab_size':248320,'num_hidden_layers':64,'num_attention_heads':24,'num_key_value_heads':4,'head_dim':256,'linear_num_key_heads':16,'linear_num_value_heads':48,'linear_key_head_dim':128,'linear_value_head_dim':128,'mtp_num_hidden_layers':1,'layer_types':['linear_attention','linear_attention','linear_attention','full_attention']*16}; open('/home/runner/work/FastFlowLM/FastFlowLM/layer-artifact/manifest.json','w').write(json.dumps(m,indent=2)+'\n')
          PY
          XU=$(find "$HOME/torch2aie" -type f -name xclbinutil -perm -111 -print -quit); python3 "$GITHUB_WORKSPACE/tools/npu/qwen38_27b_xclbin_validator.py" --xclbin "$GITHUB_WORKSPACE/layer-artifact/layer.xclbin" --xclbinutil "$XU" --label layer.xclbin --mlir "$GITHUB_WORKSPACE/layer-artifact/layer.mlir" --manifest "$GITHUB_WORKSPACE/layer-artifact/manifest.json" | tee "$GITHUB_WORKSPACE/layer-artifact/validation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: qwen38-27b-layer
          path: layer-artifact
          retention-days: 14
  lm_head:
    needs: geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate genuine 27B lm_head.xclbin with the runtime GEMM ABI
        run: |
          set -euxo pipefail
          git clone "$TORCH2AIE_REPO" "$HOME/torch2aie"; cd "$HOME/torch2aie"; git checkout --detach "$TORCH2AIE_SHA"; grep -qx 'tag=toolchain-2026-06-02' <(grep '^tag=' toolchain-release.lock); grep -qx 'archive_sha256=70222aa334057fde23be96b8763fb63b53ff7615ec004ac16ecba3abb3d5aefb' <(grep '^archive_sha256=' toolchain-release.lock); bash scripts/install_toolchain_from_release.sh; python3 -m pip install --user uv; export PATH="$HOME/.local/bin:$PATH"; bash scripts/setup_python.sh; source .venv/bin/activate; source scripts/env.sh; PEANO=$(find "$HOME/torch2aie/toolchain" -type f -path '*/bin/clang++' -perm -111 -print -quit); test -n "$PEANO"; export PEANO_INSTALL_DIR="$(dirname "$(dirname "$PEANO")")"; export QWEN38_USE_PEANO=1; python3 "$GITHUB_WORKSPACE/tools/npu/qwen38_27b_lm_head_build_v2.py" "$HOME/torch2aie"; X="$HOME/torch2aie/lm_head.xclbin"; test -s "$X"; mkdir -p "$GITHUB_WORKSPACE/lm-head-artifact"; cp "$X" "$GITHUB_WORKSPACE/lm-head-artifact/lm_head.xclbin"; cp "$HOME/torch2aie/lm_head.mlir" "$GITHUB_WORKSPACE/lm-head-artifact/lm_head.mlir"; cp "$HOME/torch2aie/lm_head.manifest.json" "$GITHUB_WORKSPACE/lm-head-artifact/manifest.json"; XU=$(find "$HOME/torch2aie" -type f -name xclbinutil -perm -111 -print -quit); python3 "$GITHUB_WORKSPACE/tools/npu/qwen38_27b_xclbin_validator.py" --xclbin "$GITHUB_WORKSPACE/lm-head-artifact/lm_head.xclbin" --xclbinutil "$XU" --label lm_head.xclbin --mlir "$GITHUB_WORKSPACE/lm-head-artifact/lm_head.mlir" --manifest "$GITHUB_WORKSPACE/lm-head-artifact/manifest.json" --expected-k 5120 --expected-n 248320 | tee "$GITHUB_WORKSPACE/lm-head-artifact/validation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: qwen38-27b-lm-head
          path: lm-head-artifact
          retention-days: 14
  package:
    needs: [q4nx,layer,lm_head]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: qwen38-27b-q4nx, path: package}
      - uses: actions/download-artifact@v4
        with: {name: qwen38-27b-layer, path: package/layer}
      - uses: actions/download-artifact@v4
        with: {name: qwen38-27b-lm-head, path: package/lm-head}
      - name: Build package and execute flm pull
        run: |
          set -euxo pipefail
          mkdir -p package/xclbins; cp package/layer/layer.xclbin package/xclbins/layer.xclbin; cp package/lm-head/lm_head.xclbin package/xclbins/lm_head.xclbin
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('package'); (root/'tree.json').write_text(json.dumps([{'path':str(p.relative_to(root)),'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in root.rglob('*') if p.is_file()],indent=2)+'\n'); p=Path('src/model_list.json'); d=json.loads(p.read_text()); d['models'].setdefault('qwen3.8',{})['27b']={'name':'Qwen3.8-27B-NPU2','url':'http://127.0.0.1:8765','file_url':'http://127.0.0.1:8765/tree.json','size':(root/'model.q4nx').stat().st_size,'flm_min_version':'0.9.43','files':['config.json','model.q4nx','tokenizer.json','tokenizer_config.json','chat_template.jinja','xclbins/layer.xclbin','xclbins/lm_head.xclbin'],'details':{'family':'qwen3.5','parameter_size':'27B','quantization_level':'Q4NX'}}; p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          cmake --preset linux-default; cmake --build src/build --target flm -j2; python3 -m http.server 8765 --directory package >/tmp/qwen38-http.log 2>&1 &; FLM=$(find src/build -type f -name flm -perm -111 -print -quit); export FLM_MODEL_PATH=/tmp/flm-models; mkdir -p "$FLM_MODEL_PATH"; "$FLM" pull qwen3.8:27b; test -s "$(find "$FLM_MODEL_PATH" -type f -name model.q4nx -print -quit)"; sha256sum package/model.q4nx package/xclbins/layer.xclbin package/xclbins/lm_head.xclbin | tee package/final-hashes.txt
      - uses: actions/upload-artifact@v4
        with: {name: qwen38-27b-final-package, path: package, retention-days: 30}
