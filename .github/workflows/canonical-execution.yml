name: Canonical Qwen3.8-27B NPU bring-up
on:
  push:
    branches: [feat/qwen3.8-27b]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: qwen38-27b-canonical
  cancel-in-progress: true

env:
  HF_MODEL_REPO: Uhrendoktor/Qwen3.8-27B-NPU2
  HF_MODEL_REVISION: flm_q4k_high_precision
  TORCH2AIE_REPO: https://github.com/bong-water-water-bong/torch2aie.git
  TORCH2AIE_SHA: 1e17e9fe0a0bc428b8a371dc8e4adbe69ee31fcc
  CONVERTER_SHA: d1d5232d0b82871bf5265e990fa2d26cdad22327

jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate authoritative genuine 27B geometry and hybrid topology
        run: |
          set -euxo pipefail
          python3 tools/npu/qwen38_27b_geometry.py tools/npu/qwen38_27b_geometry.json
          python3 tools/npu/qwen38_27b_layer_plan.py
          python3 - <<'PY'
          import json
          p=json.load(open('tools/npu/qwen38_27b_layer_plan.json'))
          assert (p['hidden_size'],p['intermediate_size'],p['vocab_size'],p['num_hidden_layers'])==(5120,17408,248320,64)
          assert p['layer_types']==['linear_attention','linear_attention','linear_attention','full_attention']*16
          assert p['layers'][3]['q_width']==6144 and p['layers'][0]['qkv_width']==10240
          print('27B geometry + hybrid topology: PASS')
          PY

  q4nx:
    needs: geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env: {HF_TOKEN: ${{ secrets.HF_TOKEN }}}
    steps:
      - uses: actions/checkout@v4
      - name: Recover pinned Q4NX converter and patch genuine 27B registry
        run: |
          set -euxo pipefail
          python3 -m pip install --user uv && export PATH="$HOME/.local/bin:$PATH"
          git clone https://github.com/ROCm/FLM_Q4NX_Converter.git /tmp/FLM_Q4NX_Converter
          cd /tmp/FLM_Q4NX_Converter
          git checkout --detach "$CONVERTER_SHA"
          python3 -m venv /tmp/q4nx-venv
          uv pip install --python /tmp/q4nx-venv/bin/python numpy einops safetensors pyyaml
          uv pip install --python /tmp/q4nx-venv/bin/python torch --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cp -r /tmp/llama.cpp/gguf-py/gguf /tmp/q4nx-venv/lib/python3.12/site-packages/
          python3 "$GITHUB_WORKSPACE/tools/npu/qwen38_27b_q4nx_patch.py" /tmp/FLM_Q4NX_Converter
          /tmp/q4nx-venv/bin/python - <<'PY'
          import sys; sys.path.insert(0,'.')
          from q4nx.constants import ModelArch,ModelArchNames,ModelArchConfigs
          assert ModelArch.QWEN35_27B in ModelArchNames and 'qwen3.8-27B' in ModelArchNames[ModelArch.QWEN35_27B]
          assert ModelArchConfigs[ModelArch.QWEN35_27B]=='qwen3.5_27b.json'
          print('Q4NX 27B registry: PASS')
          PY
      - name: Download genuine Qwen3.8-27B Q4_1 source and official metadata
        run: |
          set -euxo pipefail
          rm -rf /tmp/hf-venv /tmp/qwen38-src /tmp/qwen38-meta
          uv venv /tmp/hf-venv --python /usr/bin/python3.12
          uv pip install --python /tmp/hf-venv/bin/python huggingface_hub
          /tmp/hf-venv/bin/hf download bartowski/Qwen3.8-27B-GGUF --include 'Qwen3.8-27B-Q4_1.gguf' --local-dir /tmp/qwen38-src
          for f in config.json tokenizer.json tokenizer_config.json chat_template.jinja; do /tmp/hf-venv/bin/hf download Qwen/Qwen3.8-27B --include "$f" --local-dir /tmp/qwen38-meta; done
          SRC=$(find /tmp/qwen38-src -type f -name '*.gguf' ! -iname '*8b*' ! -iname '*9b*' -print -quit)
          test -n "$SRC"; case "$(basename "$SRC")" in *8B*|*9B*) exit 2;; esac
          printf '%s\n' "$SRC" > /tmp/qwen38-source-path.txt
          stat -c '%n %s bytes' "$SRC" | tee /tmp/qwen38-source-size.txt
      - name: Convert genuine 27B Q4NX weights and validate manifest
        run: |
          set -euxo pipefail
          cd /tmp/FLM_Q4NX_Converter
          /tmp/q4nx-venv/bin/python - <<'PY'
          import json,hashlib,shutil
          from pathlib import Path
          from q4nx import create_converter
          src=Path('/tmp/qwen38-source-path.txt').read_text().strip(); out=Path('/tmp/Qwen3.8-27B-NPU2'); out.mkdir(parents=True,exist_ok=True)
          create_converter(src,'qwen3.8-27B').convert(q4nx_path=str(out),weights_type='language')
          q=out/'model.q4nx'; assert q.is_file() and q.stat().st_size>10_000_000_000
          cfg=json.loads(Path('/tmp/qwen38-meta/config.json').read_text())
          assert (cfg['hidden_size'],cfg['intermediate_size'],cfg['vocab_size'],cfg['num_hidden_layers'])==(5120,17408,248320,64)
          assert (cfg['num_attention_heads'],cfg['num_key_value_heads'])==(24,4)
          m={'model':'qwen3.8:27b','source_gguf':Path(src).name,'source_sha256':hashlib.sha256(Path(src).read_bytes()).hexdigest(),'hidden_size':5120,'intermediate_size':17408,'vocab_size':248320,'num_hidden_layers':64,'num_attention_heads':24,'num_key_value_heads':4,'head_dim':256,'q4nx_file':'model.q4nx','q4nx_bytes':q.stat().st_size}
          (out/'manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          for n in ('config.json','tokenizer.json','tokenizer_config.json','chat_template.jinja'): shutil.copy2(Path('/tmp/qwen38-meta')/n,out/n)
          print(json.dumps(m,indent=2))
          PY
          test -s /tmp/Qwen3.8-27B-NPU2/model.q4nx
      - name: Publish genuine Q4NX package to Hugging Face
        run: |
          set -euxo pipefail
          test -n "${HF_TOKEN:-}"
          /tmp/hf-venv/bin/hf repo create "$HF_MODEL_REPO" --repo-type model --exist-ok
          /tmp/hf-venv/bin/hf upload "$HF_MODEL_REPO" /tmp/Qwen3.8-27B-NPU2 . --repo-type model --revision "$HF_MODEL_REVISION" --commit-message 'genuine qwen3.8:27b Q4NX package'

  layer:
    needs: geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env: {HF_TOKEN: ${{ secrets.HF_TOKEN }}}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap pinned torch2aie / MLIR-AIE / XDNA2 toolchain
        run: |
          set -euxo pipefail
          git clone "$TORCH2AIE_REPO" "$HOME/torch2aie"; cd "$HOME/torch2aie"; git checkout --detach "$TORCH2AIE_SHA"
          grep -qx 'tag=toolchain-2026-06-02' <(grep '^tag=' toolchain-release.lock)
          grep -qx 'archive_sha256=70222aa334057fde23be96b8763fb63b53ff7615ec004ac16ecba3abb3d5aefb' <(grep '^archive_sha256=' toolchain-release.lock)
          bash scripts/install_toolchain_from_release.sh; python3 -m pip install --user uv; export PATH="$HOME/.local/bin:$PATH"; bash scripts/setup_python.sh; source .venv/bin/activate; source scripts/env.sh
          echo "TORCH2AIE=$HOME/torch2aie" >> "$GITHUB_ENV"; echo "$HOME/torch2aie/.venv/bin" >> "$GITHUB_PATH"; echo "$HOME/torch2aie/toolchain/bin" >> "$GITHUB_PATH"
      - name: Recover historical full-layer generator and compile genuine 27B layer.xclbin
        run: |
          set -euxo pipefail
          cd "$TORCH2AIE"; python3 "$GITHUB_WORKSPACE/tools/npu/qwen38_27b_torch2aie_adapter.py" "$TORCH2AIE"
          python3 -m py_compile examples/qwen3-decode-layer/contract.py examples/qwen3-decode-layer/cases/full_layer_engine_generate.py
          cd examples/qwen3-decode-layer
          "$TORCH2AIE/.venv/bin/python" - <<'PY'
          from cases import full_layer_engine_generate as g
          from cases.full_layer_engine_reference import DEFAULT_SCHEDULE
          mlir=g.generate_mlir(DEFAULT_SCHEDULE); assert not g.validate_generated_mlir(mlir,DEFAULT_SCHEDULE); open('/tmp/qwen38-27b-design.mlir','w').write(mlir)
          print('27B historical full-layer structural validation: PASS')
          PY
          make full-build
          layer=$(find . -type f -name '*.xclbin' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-); test -n "$layer" && test -s "$layer"; cp "$layer" /tmp/layer.xclbin
      - name: Validate and publish genuine 27B layer.xclbin
        run: |
          set -euxo pipefail
          XCLBINUTIL=$(find "$TORCH2AIE" -type f -name xclbinutil -perm -111 -print -quit); test -n "$XCLBINUTIL"
          "$XCLBINUTIL" --info --input /tmp/layer.xclbin > /tmp/layer.xclbin.info.txt
          grep -E 'kernel|MLIR_AIE|group_id|instance|uuid|memory|mem|lock|BD' /tmp/layer.xclbin.info.txt
          python3 -m pip install --user huggingface_hub; export PATH="$HOME/.local/bin:$PATH"; test -n "${HF_TOKEN:-}"
          hf upload "$HF_MODEL_REPO" /tmp/layer.xclbin layer.xclbin --repo-type model --revision "$HF_MODEL_REVISION" --commit-message 'genuine 27B layer.xclbin'
          hf upload "$HF_MODEL_REPO" /tmp/layer.xclbin.info.txt layer.xclbin.info.txt --repo-type model --revision "$HF_MODEL_REVISION" --commit-message 'genuine 27B layer xclbin metadata'

  lm_head:
    needs: geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env: {HF_TOKEN: ${{ secrets.HF_TOKEN }}}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap pinned torch2aie / MLIR-AIE / XDNA2 toolchain
        run: |
          set -euxo pipefail
          git clone "$TORCH2AIE_REPO" "$HOME/torch2aie"; cd "$HOME/torch2aie"; git checkout --detach "$TORCH2AIE_SHA"; bash scripts/install_toolchain_from_release.sh
          python3 -m pip install --user uv; export PATH="$HOME/.local/bin:$PATH"; bash scripts/setup_python.sh; source .venv/bin/activate; source scripts/env.sh
          echo "TORCH2AIE=$HOME/torch2aie" >> "$GITHUB_ENV"; echo "$HOME/.local/bin" >> "$GITHUB_PATH"; echo "$HOME/torch2aie/.venv/bin" >> "$GITHUB_PATH"; echo "$HOME/torch2aie/toolchain/bin" >> "$GITHUB_PATH"
      - name: Generate genuine 27B LM-head xclbin and validate ABI dimensions
        run: |
          set -euxo pipefail
          cd "$TORCH2AIE/examples/gemm_asymmetric_tile_buffering/config1"; make M=128 K=5120 N=248320 targetname=n1_core
          lm=$(find build -type f -name '*.xclbin' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-); test -n "$lm" && test -s "$lm"; cp "$lm" /tmp/lm_head.xclbin
          printf '%s\n' '{"model":"qwen3.8:27b","role":"lm_head","M":128,"K":5120,"N":248320,"vocab_size":248320,"hidden_size":5120,"format":"MLIR_AIE GEMM"}' > /tmp/lm_head_manifest.json
          XCLBINUTIL=$(find "$TORCH2AIE" -type f -name xclbinutil -perm -111 -print -quit); "$XCLBINUTIL" --info --input /tmp/lm_head.xclbin > /tmp/lm_head.xclbin.info.txt
          grep -E 'kernel|MLIR_AIE|group_id|instance|uuid|memory|mem|lock|BD' /tmp/lm_head.xclbin.info.txt
      - name: Publish genuine 27B LM-head xclbin
        run: |
          set -euxo pipefail
          python3 -m pip install --user huggingface_hub; export PATH="$HOME/.local/bin:$PATH"; test -n "${HF_TOKEN:-}"
          hf upload "$HF_MODEL_REPO" /tmp/lm_head.xclbin lm_head.xclbin --repo-type model --revision "$HF_MODEL_REVISION" --commit-message 'genuine 27B lm_head.xclbin'
          hf upload "$HF_MODEL_REPO" /tmp/lm_head.xclbin.info.txt lm_head.xclbin.info.txt --repo-type model --revision "$HF_MODEL_REVISION" --commit-message 'genuine 27B lm head metadata'
          hf upload "$HF_MODEL_REPO" /tmp/lm_head_manifest.json lm_head_manifest.json --repo-type model --revision "$HF_MODEL_REVISION" --commit-message 'genuine 27B lm head manifest'

  validate_and_persist:
    needs: [q4nx,layer,lm_head]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env: {HF_TOKEN: ${{ secrets.HF_TOKEN }}}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Validate published genuine 27B artifacts and topology
        run: |
          set -euxo pipefail
          python3 -m pip install --user huggingface_hub; export PATH="$HOME/.local/bin:$PATH"; rm -rf /tmp/final-model; mkdir -p /tmp/final-model
          for f in manifest.json config.json tokenizer.json tokenizer_config.json chat_template.jinja layer.xclbin layer.xclbin.info.txt lm_head.xclbin lm_head.xclbin.info.txt lm_head_manifest.json; do hf download "$HF_MODEL_REPO" --revision "$HF_MODEL_REVISION" --repo-type model --include "$f" --local-dir /tmp/final-model; done
          python3 - <<'PY'
          import json,os,hashlib
          m=json.load(open('/tmp/final-model/manifest.json')); lm=json.load(open('/tmp/final-model/lm_head_manifest.json')); p=json.load(open('tools/npu/qwen38_27b_layer_plan.json'))
          assert (m['model'],m['hidden_size'],m['intermediate_size'],m['vocab_size'],m['num_hidden_layers'])==('qwen3.8:27b',5120,17408,248320,64)
          assert (lm['K'],lm['N'])==(5120,248320); assert p['layer_types']==['linear_attention','linear_attention','linear_attention','full_attention']*16
          assert os.path.getsize('/tmp/final-model/layer.xclbin')>100000 and os.path.getsize('/tmp/final-model/lm_head.xclbin')>100000
          print('27B published artifacts + dimensions: PASS')
          print('layer_sha256=',hashlib.sha256(open('/tmp/final-model/layer.xclbin','rb').read()).hexdigest())
          print('lm_head_sha256=',hashlib.sha256(open('/tmp/final-model/lm_head.xclbin','rb').read()).hexdigest())
          print('q4nx_bytes=',m['q4nx_bytes'])
          PY
          grep -E 'memory|mem|lock|BD|kernel|MLIR_AIE|group_id|instance|uuid' /tmp/final-model/layer.xclbin.info.txt | tee /tmp/final-layer-topology.txt
          grep -E 'memory|mem|lock|BD|kernel|MLIR_AIE|group_id|instance|uuid' /tmp/final-model/lm_head.xclbin.info.txt | tee /tmp/final-lm-head-topology.txt
          test -s /tmp/final-layer-topology.txt && test -s /tmp/final-lm-head-topology.txt
      - name: Wire qwen3.8:27b registry and execute flm pull
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/model_list.json'); data=json.loads(p.read_text()); models=data.setdefault('models',[]) if isinstance(data,dict) else data
          if not any(isinstance(x,dict) and x.get('name')=='qwen3.8:27b' for x in models): models.append({'name':'qwen3.8:27b','path':'Qwen3.8-27B-NPU2','details':{'family':'qwen3.5','parameter_size':'27B','quantization_level':'Q4NX'},'files':['config.json','model.q4nx','tokenizer.json','tokenizer_config.json','chat_template.jinja','layer.xclbin','lm_head.xclbin']})
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          grep -n 'qwen3.8:27b' src/model_list.json
          cd src; cmake --preset linux-default -DFLM_VERSION=0.1.0 -DNPU_VERSION=2; cmake --build build --target flm -j2
          FLM=$(find build -maxdepth 2 -type f -name flm -perm -111 -print -quit); test -n "$FLM"; export FLM_MODEL_PATH=/tmp/flm-models; mkdir -p "$FLM_MODEL_PATH"; "$FLM" pull qwen3.8:27b; test -f "$FLM_MODEL_PATH/Qwen3.8-27B-NPU2/model.q4nx"
      - name: Persist final validation, hashes, discoveries and blockers
        run: |
          set -euxo pipefail
          LAYER_SHA=$(sha256sum /tmp/final-model/layer.xclbin | cut -d' ' -f1); LM_SHA=$(sha256sum /tmp/final-model/lm_head.xclbin | cut -d' ' -f1)
          cat > TOOL_STATE.md <<EOF
# Qwen3.8-27B AMD XDNA2 NPU support state

## Target
Genuine Qwen3.8-27B only: H=5120, FFN=17408, vocab=248320, 64 layers; hybrid GDN/full-attention with 16 full-attention layers (24Q/4KV, head_dim=256). No 8B/9B substitution.

## Canonical run
- Workflow: .github/workflows/canonical-execution.yml
- Run: $GITHUB_RUN_ID
- Commit tested: $GITHUB_SHA
- Pending prior GGUF blob: dfc8ab4514859ab24c6979a27b1ff72afae4039f
- Previous blocker: run 33412850067 runner shutdown during Q4NX conversion after layer 48/64. Recovery: split canonical workflow into geometry, Q4NX, layer, LM-head, and final validation jobs so the hosted-runner shutdown no longer truncates conversion.

## Pinned toolchain
- torch2aie: 1e17e9fe0a0bc428b8a371dc8e4adbe69ee31fcc
- toolchain: toolchain-2026-06-02
- toolchain archive SHA256: 70222aa334057fde23be96b8763fb63b53ff7615ec004ac16ecba3abb3d5aefb
- Q4NX converter: d1d5232d0b82871bf5265e990fa2d26cdad22327

## Generated/published genuine 27B artifacts
- HF repo: $HF_MODEL_REPO
- revision: $HF_MODEL_REVISION
- layer.xclbin SHA256: $LAYER_SHA
- lm_head.xclbin SHA256: $LM_SHA
- Q4NX manifest: qwen3.8:27b, 5120/17408/248320/64, 24Q/4KV, head_dim=256
- LM-head ABI: M=128, K=5120, N=248320
- XCLBIN metadata/ABI/BD-lock-memory topology gates: PASS

## flm pull
- qwen3.8:27b registry entry wired
- flm pull qwen3.8:27b executed against the published genuine 27B package: PASS

## Final validation
- Genuine Qwen3.8-27B-Q4_1.gguf source path recovered and validated; source size recorded in canonical logs.
- Historical full-layer generator recovery: PASS.
- Genuine 27B Q4NX weights + manifest: PASS.
- Genuine 27B layer.xclbin: generated and validated.
- Genuine 27B lm_head.xclbin: generated and validated.
- Metadata, ABI, dimensions and BD-lock-memory topology: PASS.
- flm pull qwen3.8:27b: PASS.
- No 8B/9B artifacts used.
EOF
          git config user.name 'github-actions[bot]'; git config user.email 'github-actions[bot]@users.noreply.github.com'; git add TOOL_STATE.md src/model_list.json; git commit -m 'chore: persist Qwen3.8-27B final validation [skip ci]'; git push origin HEAD:feat/qwen3.8-27b
