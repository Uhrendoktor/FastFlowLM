name: Canonical Qwen3.8-27B NPU bring-up

on:
  push:
    branches: [feat/qwen3.8-27b]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qwen38-27b-canonical
  cancel-in-progress: true

jobs:
  bringup:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout FastFlowLM
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate authoritative 27B geometry
        run: |
          set -euxo pipefail
          python3 tools/npu/qwen38_27b_geometry.py tools/npu/qwen38_27b_geometry.json
          python3 tools/npu/qwen38_27b_layer_plan.py
          test -f tools/npu/qwen38_27b_layer_plan.json
          python3 -m py_compile tools/npu/qwen38_27b_geometry.py tools/npu/qwen38_27b_layer_plan.py
          python3 - <<'PY'
          import json
          p=json.load(open('tools/npu/qwen38_27b_layer_plan.json'))
          assert p['num_hidden_layers']==64
          assert p['layer_types'].count('linear_attention')==48
          assert p['layer_types'].count('full_attention')==16
          assert p['layer_types'][3]=='full_attention'
          assert p['layer_types'][0]=='linear_attention'
          print('hybrid layer plan: PASS')
          PY

      - name: Bootstrap pinned torch2aie / MLIR-AIE / XDNA2 toolchain
        env:
          TORCH2AIE_REPO: https://github.com/bong-water-water-bong/torch2aie
        run: |
          set -euxo pipefail
          rm -rf "$HOME/torch2aie"
          git clone --depth 1 "$TORCH2AIE_REPO" "$HOME/torch2aie"
          cd "$HOME/torch2aie"
          test -f toolchain-release.lock
          grep -qx 'tag=toolchain-2026-06-02' <(grep '^tag=' toolchain-release.lock)
          grep -qx 'archive_sha256=70222aa334057fde23be96b8763fb63b53ff7615ec004ac16ecba3abb3d5aefb' <(grep '^archive_sha256=' toolchain-release.lock)
          bash scripts/install_toolchain_from_release.sh
          python3 -m pip install --user uv
          export PATH="$HOME/.local/bin:$PATH"
          command -v uv
          bash scripts/setup_python.sh
          source .venv/bin/activate
          if [ -f requirements.txt ]; then uv pip install -r requirements.txt; fi
          echo "TORCH2AIE=$HOME/torch2aie" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/torch2aie/.venv/bin" >> "$GITHUB_PATH"
          echo "$HOME/torch2aie/toolchain/bin" >> "$GITHUB_PATH"
          {
            echo "torch2aie=$(git rev-parse HEAD)"
            cat toolchain-release.lock
            find "$HOME/torch2aie" -type f \( -name aiecc -o -name xclbinutil -o -name peano -o -name llc -o -name xchesscc_wrapper \) -print | sort
          } | tee /tmp/toolchain.txt

      - name: Recover historical Q4NX and hybrid kernel work
        run: |
          set -euxo pipefail
          rm -rf /tmp/onebit
          git clone https://github.com/1bit-MONSTER/1bit-MONSTER.git /tmp/onebit
          cd /tmp/onebit
          for sha in \
            30ec46c499148e8dcdbb7992821859a81de6f371 \
            9ecd48422d84b46b830059969b94e0f242f0d5c5 \
            2dfcc37782124eb7728e3d5ff7b9e6e82f11a1c7 \
            595057091e7464fd5589b92b6b0aabe9674d20e2 \
            9413084761fdf7ed018f15ad1d591117b3d94a6e \
            c71060a568d531c744311c1560c2b0e45be1c898; do
            git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch origin "$sha" || true
          done
          git log --all --oneline --decorate --grep='Q4NX\|Qwen3.6\|full-layer\|kernel generation\|FastFlowLM' -i -120 | tee /tmp/historical.log || true
          {
            echo '=== Q4NX converter candidates ==='
            find . -type f \( -name '*.py' -o -name '*.sh' -o -name '*.cpp' -o -name '*.md' \) -print0 | xargs -0 grep -n -i -E 'convert_qwen36_moe_q4nx|q4nx|gguf_to_onebp' 2>/dev/null | head -2500 || true
            echo '=== hybrid/GDN candidates ==='
            find . -type f \( -name '*.py' -o -name '*.cpp' -o -name '*.h' -o -name '*.md' \) -print0 | xargs -0 grep -n -i -E 'gated.?delta|full.?attention|linear_attention|qwen36_gdn_probe|qwen36_full_ref' 2>/dev/null | head -2500 || true
            echo '=== AIE generator candidates ==='
            find . -type f \( -name '*.py' -o -name '*.sh' -o -name '*.cpp' \) -print0 | xargs -0 grep -n -E 'n1_core_i8|build_moe_v|gemm_generate_sequence_i8|gen_npu_insts' 2>/dev/null | head -2500 || true
          } | tee /tmp/historical-code-index.txt

      - name: Build and inspect the known-good Qwen3.5-9B reference package
        run: |
          set -euxo pipefail
          mkdir -p /tmp/qwen35-9b
          curl -fsSL https://api.github.com/repos/ROCm/FastFlowLM/contents/src/xclbins/Qwen3.5-9B-NPU2 |
            python3 -c 'import json,sys; print("\n".join(x["download_url"] for x in json.load(sys.stdin) if x.get("name","").endswith(".xclbin")))' |
            tee /tmp/qwen35-urls.txt
          test -s /tmp/qwen35-urls.txt
          while read -r url; do curl -fL --retry 3 -o "/tmp/qwen35-9b/$(basename "$url")" "$url"; done < /tmp/qwen35-urls.txt
          find /tmp/qwen35-9b -maxdepth 1 -type f -name '*.xclbin' -printf '%f %s\n' | sort | tee /tmp/qwen35-sizes.txt
          XCLBINUTIL=$(find "$TORCH2AIE" -type f -name xclbinutil -print -quit)
          test -x "$XCLBINUTIL"
          for f in /tmp/qwen35-9b/*.xclbin; do
            "$XCLBINUTIL" --info --input "$f" > "$f.info.txt"
          done
          grep -R -E 'kernel|KERNEL|MLIR_AIE|group_id|instance|uuid|BD|lock' /tmp/qwen35-9b/*.info.txt | head -1200 | tee /tmp/qwen35-abi.txt || true

      - name: Run the historical dense generator as a reference-only ABI test
        run: |
          set -euxo pipefail
          cd "$TORCH2AIE/examples/qwen3-decode-layer"
          test -f run_full_layer.py
          test -f cases/full_layer_engine_generate.py
          test -f cases/full_layer_engine_reference.py
          python3 -m py_compile run_full_layer.py cases/full_layer_engine_generate.py cases/full_layer_engine_reference.py
          python3 - <<'PY' | tee /tmp/dense-reference.txt
          from cases import full_layer_engine_generate as g
          from cases.full_layer_engine_reference import DEFAULT_SCHEDULE
          mlir = g.generate_mlir(DEFAULT_SCHEDULE)
          errors = g.validate_generated_mlir(mlir, DEFAULT_SCHEDULE)
          print('generated_mlir_bytes=', len(mlir.encode()))
          print('validation_errors=', errors)
          if errors:
              raise SystemExit(2)
          PY

      - name: Prove the 27B generator is hybrid, not a resized 8B/9B dense config
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('tools/npu/qwen38_27b_layer_plan.json'))
          assert p['hidden_size']==5120
          assert p['intermediate_size']==17408
          assert p['vocab_size']==248320
          assert p['num_hidden_layers']==64
          assert p['layer_types']==['linear_attention','linear_attention','linear_attention','full_attention']*16
          for x in p['layers']:
              if x['kind']=='full_attention':
                  assert (x['q_width'],x['q_gate_width'],x['k_width'],x['v_width'])==(6144,12288,1024,1024)
              else:
                  assert (x['qk_width'],x['value_width'],x['qkv_width'],x['z_width'],x['conv_channels'])==(2048,6144,10240,6144,10240)
          print('27B hybrid generator contract: PASS')
          PY

      - name: Generate only genuine 27B candidates
        run: |
          set -euxo pipefail
          mkdir -p /tmp/qwen38-27b
          cp tools/npu/qwen38_27b_geometry.json /tmp/qwen38-27b/
          cp tools/npu/qwen38_27b_layer_plan.json /tmp/qwen38-27b/
          cat > /tmp/qwen38-27b/SHIP_GATE.md <<'EOF'
          # Qwen3.8:27b artifact ship gate

          A final `layer.xclbin` or `lm_head.xclbin` is accepted only if its
          generator inputs prove H=5120, FFN=17408, V=248320, 64 layers and
          the 48-GDN/16-full-attention topology. Qwen3-8B and Qwen3.5-9B
          XCLBINs are reference-only and are never copied into this directory.
          EOF
          if ! grep -R -q -E 'qwen38_27b_layer_plan|linear_attention|gated.?delta' "$TORCH2AIE/examples/qwen3-decode-layer" /tmp/onebit 2>/dev/null; then
            echo 'No hybrid AIE generator implementation is present yet; refusing to manufacture a 27B XCLBIN from the dense reference.' | tee /tmp/27b-blocker.txt
            exit 2
          fi
          echo 'Hybrid generator implementation detected; next step is genuine XCLBIN generation.'

      - name: Upload canonical diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-27b-canonical-diagnostics
          path: |
            /tmp/toolchain.txt
            /tmp/historical.log
            /tmp/historical-code-index.txt
            /tmp/qwen35-urls.txt
            /tmp/qwen35-sizes.txt
            /tmp/qwen35-abi.txt
            /tmp/qwen35-9b/**
            /tmp/dense-reference.txt
            /tmp/27b-blocker.txt
            /tmp/qwen38-27b/**
            tools/npu/qwen38_27b_layer_plan.json
          if-no-files-found: ignore
