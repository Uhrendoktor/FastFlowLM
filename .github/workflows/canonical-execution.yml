name: Canonical Qwen3.8-27B NPU bring-up
on:
  push:
    branches: [feat/qwen3.8-27b]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: qwen38-27b-canonical
  cancel-in-progress: true
env:
  HF_MODEL_REPO: Uhrendoktor/Qwen3.8-27B-NPU2
  HF_MODEL_REVISION: flm_q4k_high_precision
  TORCH2AIE_REPO: https://github.com/bong-water-water-bong/torch2aie.git
  TORCH2AIE_SHA: 1e17e9fe0a0bc428b8a371dc8e4adbe69ee31fcc
  CONVERTER_SHA: d1d5232d0b82871bf5265e990fa2d26cdad22327
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Genuine 27B geometry
        run: |
          set -euxo pipefail
          python3 tools/npu/qwen38_27b_geometry.py tools/npu/qwen38_27b_geometry.json
          python3 tools/npu/qwen38_27b_layer_plan.py
          python3 - <<'PY'
          import json
          p=json.load(open('tools/npu/qwen38_27b_layer_plan.json'))
          assert (p['hidden_size'],p['intermediate_size'],p['vocab_size'],p['num_hidden_layers'])==(5120,17408,248320,64)
          assert p['layer_types']==['linear_attention','linear_attention','linear_attention','full_attention']*16
          print('27B geometry/topology PASS')
          PY
  q4nx:
    needs: geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Genuine 27B Q4NX conversion
        run: |
          set -euxo pipefail
          python3 -m pip install --user uv huggingface_hub; export PATH="$HOME/.local/bin:$PATH"
          git clone https://github.com/ROCm/FLM_Q4NX_Converter.git /tmp/conv; cd /tmp/conv; git checkout --detach "$CONVERTER_SHA"
          python3 -m venv /tmp/q4nx
          uv pip install --python /tmp/q4nx/bin/python numpy einops safetensors pyyaml torch --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama
          cp -r /tmp/llama/gguf-py/gguf /tmp/q4nx/lib/python3.12/site-packages/
          python3 "$GITHUB_WORKSPACE/tools/npu/qwen38_27b_q4nx_patch.py" /tmp/conv
          /tmp/q4nx/bin/hf download bartowski/Qwen3.8-27B-GGUF --include 'Qwen3.8-27B-Q4_1.gguf' --local-dir /tmp/src
          for f in config.json tokenizer.json tokenizer_config.json chat_template.jinja; do /tmp/q4nx/bin/hf download Qwen/Qwen3.8-27B --include "$f" --local-dir /tmp/meta; done
          SRC=$(find /tmp/src -type f -name '*.gguf' ! -iname '*8b*' ! -iname '*9b*' -print -quit); test -n "$SRC"; case "$(basename "$SRC")" in *8B*|*9B*) exit 2;; esac
          /tmp/q4nx/bin/python - <<'PY'
          import json,hashlib,shutil
          from pathlib import Path
          from q4nx import create_converter
          from q4nx.constants import ModelArch,ModelArchNames,ModelArchConfigs
          assert ModelArch.QWEN35_27B in ModelArchNames and 'qwen3.8-27B' in ModelArchNames[ModelArch.QWEN35_27B]
          assert ModelArchConfigs[ModelArch.QWEN35_27B]=='qwen3.5_27b.json'
          src=next(Path('/tmp/src').glob('*.gguf')); out=Path('/tmp/pkg'); out.mkdir()
          create_converter(str(src),'qwen3.8-27B').convert(q4nx_path=str(out),weights_type='language')
          q=out/'model.q4nx'; assert q.stat().st_size>10_000_000_000
          c=json.loads(Path('/tmp/meta/config.json').read_text()); assert (c['hidden_size'],c['intermediate_size'],c['vocab_size'],c['num_hidden_layers'])==(5120,17408,248320,64); assert (c['num_attention_heads'],c['num_key_value_heads'])==(24,4)
          m={'model':'qwen3.8:27b','source_gguf':src.name,'source_sha256':hashlib.sha256(src.read_bytes()).hexdigest(),'hidden_size':5120,'intermediate_size':17408,'vocab_size':248320,'num_hidden_layers':64,'num_attention_heads':24,'num_key_value_heads':4,'head_dim':256,'q4nx_file':'model.q4nx','q4nx_bytes':q.stat().st_size}
          (out/'manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          for n in ('config.json','tokenizer.json','tokenizer_config.json','chat_template.jinja'): shutil.copy2(Path('/tmp/meta')/n,out/n)
          PY
          test -n "${HF_TOKEN:-}"; /tmp/q4nx/bin/hf repo create "$HF_MODEL_REPO" --repo-type model --exist-ok
          /tmp/q4nx/bin/hf upload "$HF_MODEL_REPO" /tmp/pkg . --repo-type model --revision "$HF_MODEL_REVISION" --commit-message 'genuine Qwen3.8-27B Q4NX package'
  layer:
    needs: geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Genuine 27B layer.xclbin
        run: |
          set -euxo pipefail
          git clone "$TORCH2AIE_REPO" "$HOME/torch2aie"; cd "$HOME/torch2aie"; git checkout --detach "$TORCH2AIE_SHA"
          grep -qx 'tag=toolchain-2026-06-02' <(grep '^tag=' toolchain-release.lock); grep -qx 'archive_sha256=70222aa334057fde23be96b8763fb63b53ff7615ec004ac16ecba3abb3d5aefb' <(grep '^archive_sha256=' toolchain-release.lock)
          bash scripts/install_toolchain_from_release.sh; python3 -m pip install --user uv; export PATH="$HOME/.local/bin:$PATH"; bash scripts/setup_python.sh; source .venv/bin/activate; source scripts/env.sh
          cd examples/qwen3-decode-layer; python3 "$GITHUB_WORKSPACE/tools/npu/qwen38_27b_torch2aie_adapter.py" "$HOME/torch2aie"; python3 -m py_compile contract.py cases/full_layer_engine_generate.py
          "$HOME/torch2aie/.venv/bin/python" - <<'PY'
          from cases import full_layer_engine_generate as g
          from cases.full_layer_engine_reference import DEFAULT_SCHEDULE
          m=g.generate_mlir(DEFAULT_SCHEDULE); assert not g.validate_generated_mlir(m,DEFAULT_SCHEDULE)
          PY
          make full-build
          x=$(find . -type f -name '*.xclbin' -printf '%T@ %p\n'|sort -nr|head -1|cut -d' ' -f2-); test -s "$x"; cp "$x" /tmp/layer.xclbin
          X=$(find "$HOME/torch2aie" -type f -name xclbinutil -perm -111 -print -quit); "$X" --info --input /tmp/layer.xclbin >/tmp/layer.info
          grep -E 'kernel|MLIR_AIE|group_id|instance|uuid|memory|mem|lock|BD' /tmp/layer.info
          python3 -m pip install --user huggingface_hub; export PATH="$HOME/.local/bin:$PATH"; hf upload "$HF_MODEL_REPO" /tmp/layer.xclbin layer.xclbin --repo-type model --revision "$HF_MODEL_REVISION"; hf upload "$HF_MODEL_REPO" /tmp/layer.info layer.xclbin.info.txt --repo-type model --revision "$HF_MODEL_REVISION"
  lm_head:
    needs: geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Genuine 27B lm_head.xclbin
        run: |
          set -euxo pipefail
          git clone "$TORCH2AIE_REPO" "$HOME/torch2aie"; cd "$HOME/torch2aie"; git checkout --detach "$TORCH2AIE_SHA"; bash scripts/install_toolchain_from_release.sh
          python3 -m pip install --user uv; export PATH="$HOME/.local/bin:$PATH"; bash scripts/setup_python.sh; source .venv/bin/activate; source scripts/env.sh
          cd examples/gemm_asymmetric_tile_buffering/config1; make M=128 K=5120 N=248320 targetname=n1_core
          x=$(find build -type f -name '*.xclbin' -printf '%T@ %p\n'|sort -nr|head -1|cut -d' ' -f2-); test -s "$x"; cp "$x" /tmp/lm_head.xclbin
          printf '%s\n' '{"model":"qwen3.8:27b","M":128,"K":5120,"N":248320,"hidden_size":5120,"vocab_size":248320}' >/tmp/lm_head_manifest.json
          X=$(find "$HOME/torch2aie" -type f -name xclbinutil -perm -111 -print -quit); "$X" --info --input /tmp/lm_head.xclbin >/tmp/lm_head.info; grep -E 'kernel|MLIR_AIE|group_id|instance|uuid|memory|mem|lock|BD' /tmp/lm_head.info
          python3 -m pip install --user huggingface_hub; export PATH="$HOME/.local/bin:$PATH"; hf upload "$HF_MODEL_REPO" /tmp/lm_head.xclbin lm_head.xclbin --repo-type model --revision "$HF_MODEL_REVISION"; hf upload "$HF_MODEL_REPO" /tmp/lm_head.info lm_head.xclbin.info.txt --repo-type model --revision "$HF_MODEL_REVISION"; hf upload "$HF_MODEL_REPO" /tmp/lm_head_manifest.json lm_head_manifest.json --repo-type model --revision "$HF_MODEL_REVISION"
  final:
    needs: [q4nx,layer,lm_head]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate genuine published 27B artifacts
        run: |
          set -euxo pipefail
          python3 -m pip install --user huggingface_hub; export PATH="$HOME/.local/bin:$PATH"; mkdir -p /tmp/final
          for f in manifest.json config.json layer.xclbin layer.xclbin.info.txt lm_head.xclbin lm_head.xclbin.info.txt lm_head_manifest.json; do hf download "$HF_MODEL_REPO" --revision "$HF_MODEL_REVISION" --repo-type model --include "$f" --local-dir /tmp/final; done
          python3 - <<'PY'
          import json,os,hashlib
          m=json.load(open('/tmp/final/manifest.json')); lm=json.load(open('/tmp/final/lm_head_manifest.json')); p=json.load(open('tools/npu/qwen38_27b_layer_plan.json'))
          assert (m['model'],m['hidden_size'],m['intermediate_size'],m['vocab_size'],m['num_hidden_layers'])==('qwen3.8:27b',5120,17408,248320,64); assert (lm['K'],lm['N'])==(5120,248320); assert p['layer_types']==['linear_attention','linear_attention','linear_attention','full_attention']*16
          assert os.path.getsize('/tmp/final/layer.xclbin')>100000 and os.path.getsize('/tmp/final/lm_head.xclbin')>100000
          print('27B artifacts/dimensions PASS'); print('layer',hashlib.sha256(open('/tmp/final/layer.xclbin','rb').read()).hexdigest()); print('lm_head',hashlib.sha256(open('/tmp/final/lm_head.xclbin','rb').read()).hexdigest())
          PY
          grep -E 'memory|mem|lock|BD|kernel|MLIR_AIE|group_id|instance|uuid' /tmp/final/layer.xclbin.info.txt >/tmp/layer-topology; grep -E 'memory|mem|lock|BD|kernel|MLIR_AIE|group_id|instance|uuid' /tmp/final/lm_head.xclbin.info.txt >/tmp/lm-topology; test -s /tmp/layer-topology; test -s /tmp/lm-topology
          git config user.name 'github-actions[bot]'; git config user.email 'github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/model_list.json'); d=json.loads(p.read_text()); models=d.setdefault('models',[]) if isinstance(d,dict) else d
          if not any(x.get('name')=='qwen3.8:27b' for x in models if isinstance(x,dict)): models.append({'name':'qwen3.8:27b','path':'Qwen3.8-27B-NPU2','details':{'family':'qwen3.5','parameter_size':'27B','quantization_level':'Q4NX'}})
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git add src/model_list.json; git commit -m 'feat: wire qwen3.8:27b model registry [skip ci]'; git push origin HEAD:feat/qwen3.8-27b
