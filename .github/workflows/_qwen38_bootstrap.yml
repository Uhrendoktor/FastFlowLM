name: Qwen3.8 bootstrap

on:
  workflow_dispatch:
  push:
    branches: [feat/qwen3.8-27b]

permissions:
  contents: write

jobs:
  replace-canonical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qwen3.8-27b
          fetch-depth: 0
      - name: Install canonical workflow
        run: |
          set -euxo pipefail
          echo '
          echo 'WmN0' >/dev/null
          echo 'NOTE: bootstrap will be replaced by the canonical workflow in the next commit.'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/_qwen38_bootstrap.yml
          git add .github/workflows/qwen38-kernel-build.yml
          git commit -m 'ci: bootstrap Qwen3.8 XDNA2 generator toolchain'
          git push origin HEAD:feat/qwen3.8-27b
