name: Qwen3.8-27B XDNA2 kernel build

on:
  push:
    branches: [feat/qwen3.8-27b]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-kernels:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout FastFlowLM
        uses: actions/checkout@v4
        with:
          ref: feat/qwen3.8-27b
          fetch-depth: 0
          submodules: recursive

      - name: Bootstrap torch2aie + MLIR-AIE toolchain
        env:
          TORCH2AIE_REPO: https://github.com/bong-water-water-bong/torch2aie
        run: |
          set -euxo pipefail
          rm -rf "$HOME/torch2aie"
          git clone --depth 1 "$TORCH2AIE_REPO" "$HOME/torch2aie"
          cd "$HOME/torch2aie"
          test -f scripts/install_toolchain_from_release.sh
          test -f toolchain-release.lock
          bash scripts/install_toolchain_from_release.sh
          python3 -m pip install --upgrade pip uv
          if [ -f scripts/setup_python.sh ]; then bash scripts/setup_python.sh; fi
          source "$HOME/torch2aie/.venv/bin/activate"
          if [ -f requirements.txt ]; then uv pip install -r requirements.txt; fi
          echo "TORCH2AIE=$HOME/torch2aie" >> "$GITHUB_ENV"
          echo "VIRTUAL_ENV=$HOME/torch2aie/.venv" >> "$GITHUB_ENV"
          echo "$HOME/torch2aie/.venv/bin" >> "$GITHUB_PATH"
          echo "$HOME/torch2aie/toolchain/bin" >> "$GITHUB_PATH"
          {
            echo '=== torch2aie ==='
            git rev-parse HEAD
            echo '=== toolchain lock ==='
            cat toolchain-release.lock
            echo '=== toolchain binaries ==='
            find "$HOME/torch2aie" -type f \( -name aiecc -o -name xclbinutil -o -name peano -o -name llc \) -print | sort
          } | tee /tmp/toolchain.txt

      - name: Recover historical Q4NX / kernel-generation work
        run: |
          set -euxo pipefail
          rm -rf /tmp/onebit
          git clone https://github.com/1bit-MONSTER/1bit-MONSTER.git /tmp/onebit
          cd /tmp/onebit
          git fetch origin pull/1078/head:pr-1078 || true
          git fetch origin pull/1111/head:pr-1111 || true
          git fetch origin pull/1185/head:pr-1185 || true
          git fetch origin 5525db348bcfdbf455d6b6c30019d4c736103e69 || true
          git log --all --oneline --decorate -160 > /tmp/onebit-history.txt
          git log --all --oneline --decorate --grep='Q4NX\|Qwen3.5\|kernel generation\|full-layer\|FastFlowLM' -i -120 | tee /tmp/relevant_history.txt || true
          printf '%s\n' '=== generator refs ==='
          grep -R -n -E 'full_layer_engine_generate|run_full_layer.py|qwen3_constants|q4nx_to_chunk|gguf_to_q4nx' --include='*.py' --include='*.sh' --include='*.md' . | head -2000 | tee /tmp/generator_refs.txt || true

      - name: Establish upstream Qwen3.5-9B reference ABI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p /tmp/flm-qwen35-9b
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/ROCm/FastFlowLM/contents/src/xclbins/Qwen3.5-9B-NPU2 |
            python3 -c 'import json,sys; print("\n".join(x["download_url"] for x in json.load(sys.stdin) if x.get("name","").endswith(".xclbin")))' |
            tee /tmp/qwen35_urls.txt
          test -s /tmp/qwen35_urls.txt
          while read -r url; do curl -fL --retry 3 -o "/tmp/flm-qwen35-9b/$(basename "$url")" "$url"; done < /tmp/qwen35_urls.txt
          find /tmp/flm-qwen35-9b -type f -name '*.xclbin' -printf '%f %s bytes\n' | sort | tee /tmp/qwen35_sizes.txt
          XCLBINUTIL=$(find "$TORCH2AIE" -type f -name xclbinutil -print -quit || true)
          test -n "$XCLBINUTIL"
          for f in /tmp/flm-qwen35-9b/*.xclbin; do
            "$XCLBINUTIL" --info --input "$f" > "$f.info.txt"
          done
          grep -R -E 'KERNEL|kernel|uuid|aie' /tmp/flm-qwen35-9b/*.info.txt | head -200 | tee /tmp/qwen35_abi_summary.txt || true

      - name: Validate the real full-layer generator/toolchain contract
        run: |
          set -euxo pipefail
          cd "$TORCH2AIE/examples/qwen3-decode-layer"
          test -f run_full_layer.py
          test -f cases/full_layer_engine_generate.py
          python3 - <<'PY' | tee /tmp/full_layer_generator_check.txt
          from cases import full_layer_engine_generate as g
          from cases.full_layer_engine_reference import DEFAULT_SCHEDULE
          mlir = g.generate_mlir(DEFAULT_SCHEDULE)
          errors = g.validate_generated_mlir(mlir, DEFAULT_SCHEDULE)
          print('mlir_bytes=', len(mlir.encode()))
          print('validation_errors=', len(errors))
          for e in errors:
              print('ERROR:', e)
          if errors:
              raise SystemExit(2)
          PY
          python3 -m py_compile cases/full_layer_engine_generate.py run_full_layer.py
          rm -rf build/ci-reference
          mkdir -p build/ci-reference
          python3 - <<'PY'
          from pathlib import Path
          from cases import full_layer_engine_generate as g
          from cases.full_layer_engine_reference import DEFAULT_SCHEDULE
          p=Path('build/ci-reference/design.mlir')
          p.write_text(g.generate_mlir(DEFAULT_SCHEDULE))
          print(p, p.stat().st_size)
          PY
          python3 - <<'PY' | tee /tmp/full_layer_compile.txt
          from pathlib import Path
          import npu_build
          mlir=Path('build/ci-reference/design.mlir')
          xcl=Path('build/ci-reference/design.xclbin')
          inst=Path('build/ci-reference/design.bin')
          npu_build.compile_mlir(mlir,xcl,inst)
          print('xclbin=',xcl, xcl.stat().st_size)
          print('instructions=',inst, inst.stat().st_size)
          PY

      - name: Derive and validate Qwen3.8-27B generator configuration
        run: |
          set -euxo pipefail
          cat > /tmp/qwen38_27b_geometry.json <<'EOF'
          {
            "model": "qwen3.8:27b",
            "hidden_size": 5120,
            "intermediate_size": 17408,
            "vocab_size": 248320,
            "layers": 64,
            "full_attention_interval": 4,
            "full_attention_q_heads": 24,
            "full_attention_kv_heads": 4,
            "full_attention_head_dim": 256,
            "linear_attention_q_heads": 16,
            "linear_attention_v_heads": 48,
            "linear_attention_head_dim": 128
          }
          EOF
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/qwen38_27b_geometry.json'))
          assert p['hidden_size']==5120
          assert p['intermediate_size']==17408
          assert p['vocab_size']==248320
          assert p['layers']==64
          assert p['full_attention_interval']==4
          assert p['full_attention_q_heads']==24 and p['full_attention_kv_heads']==4
          assert p['linear_attention_q_heads']==16 and p['linear_attention_v_heads']==48
          print('geometry: PASS')
          PY
          cp /tmp/qwen38_27b_geometry.json /tmp/onebit/qwen38_27b_geometry.json

      - name: Record the real 27B generation boundary
        run: |
          set -euxo pipefail
          cd "$TORCH2AIE/examples/qwen3-decode-layer"
          {
            echo '=== current full-layer generator ==='
            grep -R -n -E 'HIDDEN_DWORDS|TOTAL_WEIGHT_AND_AUX_I32|MAIN_COLUMNS|MAIN_ROWS|DEFAULT_SCHEDULE|Qwen3Q4NXModel' cases/full_layer_engine_generate.py cases/full_layer_engine_reference.py cases/decode_cache_reference.py cases/contract.py 2>/dev/null | head -300
            echo '=== migration map ==='
            cat MIGRATION-4to8-GAPMAP.md
            echo '=== qwen3 runner model binding ==='
            grep -n -E 'qwen3_8b|DEFAULT_QWEN3_8B|Qwen3Q4NXModel' cases/qwen3_8b_decode_layer_runner.py | head -100
          } | tee /tmp/27b_generation_boundary.txt
          echo 'The 27B layer build must be a real geometry/contract port of this generator; no 9B XCLBIN substitution is allowed.'

      - name: Upload build and ABI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-27b-kernel-diagnostics
          path: |
            /tmp/toolchain.txt
            /tmp/onebit-history.txt
            /tmp/relevant_history.txt
            /tmp/generator_refs.txt
            /tmp/qwen35_urls.txt
            /tmp/qwen35_sizes.txt
            /tmp/qwen35_abi_summary.txt
            /tmp/full_layer_generator_check.txt
            /tmp/full_layer_compile.txt
            /tmp/27b_generation_boundary.txt
            /tmp/flm-qwen35-9b/**
            /tmp/qwen38_27b_geometry.json
            $TORCH2AIE/examples/qwen3-decode-layer/build/ci-reference/**
          if-no-files-found: ignore
