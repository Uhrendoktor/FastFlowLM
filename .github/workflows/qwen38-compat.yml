name: Qwen3.8 Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/include/AutoModel/all_models.hpp'
      - 'tests/test_qwen38_compat.py'
      - '.github/workflows/qwen38-compat.yml'
  workflow_dispatch:

jobs:
  qwen38-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Qwen3.8 architecture and routing checks
        run: python3 tests/test_qwen38_compat.py
