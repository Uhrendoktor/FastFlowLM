name: Repair canonical Qwen3.8 workflow
on:
  push:
    branches: [feat/qwen3.8-27b]
  workflow_dispatch:
permissions:
  contents: write
  workflows: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Repair YAML-sensitive env mappings
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/canonical-execution.yml')
          s=p.read_text()
          expr=chr(36)+'{{ secrets.HF_TOKEN }}'
          s=s.replace('    env: {HF_TOKEN: '+expr+'}\n', '    env:\n      HF_TOKEN: '+expr+'\n')
          p.write_text(s)
          PY
          ! grep -q 'env: {HF_TOKEN:' .github/workflows/canonical-execution.yml
      - name: Commit repaired canonical workflow
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/canonical-execution.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair canonical workflow YAML [skip ci]'
          git push origin HEAD:feat/qwen3.8-27b
